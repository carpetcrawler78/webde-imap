name: WEB.DE to Gmail Forwarder

on:
  workflow_dispatch:
    inputs:
      bootstrap_mode:
        description: "Manueller Import-Modus (leer = normaler Lauf)"
        type: choice
        options:
          - ""
          - last_n
          - time_window
        default: ""
      bootstrap_last_n:
        description: "Anzahl Mails bei bootstrap_mode=last_n"
        default: "10"
      bootstrap_window_hours:
        description: "Stunden bei bootstrap_mode=time_window"
        default: "24"
      dry_run:
        description: "Nur klassifizieren, nichts senden, State nicht speichern"
        type: boolean
        default: false
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: webde-imap-forwarder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run WEB.DE forwarder
        env:
          WEBDE_IMAP_SERVER: ${{ secrets.WEBDE_IMAP_SERVER }}
          WEBDE_IMAP_USERNAME: ${{ secrets.WEBDE_IMAP_USERNAME }}
          WEBDE_IMAP_PASSWORD: ${{ secrets.WEBDE_IMAP_PASSWORD }}
          WEBDE_IMAP_FOLDERS: ${{ vars.WEBDE_IMAP_FOLDERS }}
          WEBDE_SMTP_SERVER: ${{ secrets.WEBDE_SMTP_SERVER }}
          WEBDE_SMTP_PORT: ${{ secrets.WEBDE_SMTP_PORT }}
          WEBDE_SMTP_USERNAME: ${{ secrets.WEBDE_SMTP_USERNAME }}
          WEBDE_SMTP_PASSWORD: ${{ secrets.WEBDE_SMTP_PASSWORD }}
          WEBDE_FORWARD_TO: ${{ secrets.WEBDE_FORWARD_TO }}
          WEBDE_MAX_ATTACHMENT_TOTAL_BYTES: ${{ vars.WEBDE_MAX_ATTACHMENT_TOTAL_BYTES }}
          PYTHONPATH: src
        run: >-
          python -m webde_imap.cli
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.bootstrap_mode == 'last_n' && format('--bootstrap-last-n {0}', inputs.bootstrap_last_n) || '' }}
          ${{ inputs.bootstrap_mode == 'time_window' && format('--bootstrap-window-hours {0}', inputs.bootstrap_window_hours) || '' }}

      - name: Check for state changes
        id: diff
        if: always()
        run: |
          if [ ! -f runtime/webde_state.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `git diff` (without staging) ignores files that were never tracked
          # before, so a brand-new state file would silently look "unchanged".
          # Stage it first and diff against the index instead.
          git add runtime/webde_state.json
          if git diff --cached --quiet -- runtime/webde_state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated state
        if: always() && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update WEB.DE IMAP state"
          git push
